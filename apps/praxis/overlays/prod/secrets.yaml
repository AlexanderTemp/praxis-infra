apiVersion: v1
kind: ServiceAccount
metadata:
  name: praxis-eso
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: praxis-prod
          serviceAccountRef:
            name: praxis-eso
            audiences: ["openbao"]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: praxis-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: praxis-secrets
  dataFrom:
    - extract:
        key: praxis/prod     # trae TODAS las claves: DB_PASSWORD, S3_SECRET_KEY, AI_...
