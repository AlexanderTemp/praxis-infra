apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/alexandertemp/praxis-backend    # la versión la pone cada overlay
          ports:
            - containerPort: 8080
          env:
            - { name: DB_URL,        value: "jdbc:postgresql://postgres:5432/praxis" }
            - { name: DB_USER,       value: praxis }
            - { name: S3_ENDPOINT,   value: "http://minio:9000" }
            - { name: S3_ACCESS_KEY, value: praxis }
            - { name: S3_BUCKET,     value: praxis-assets }
            - { name: COOKIE_SECURE, value: "true" }
          envFrom:
            - configMapRef:
                name: praxis-config     # lo propio de cada entorno (URL pública, modelos)
            - secretRef:
                name: praxis-secrets    # DB_PASSWORD, S3_SECRET_KEY, AI_* desde OpenBao
          startupProbe:                 # da hasta 3 min para arrancar (JVM + Flyway)
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:               # si falla, deja de recibir tráfico
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
          livenessProbe:                # si falla seguido, k3s lo reinicia
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
