apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-demo
  namespace: demo
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: demo
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: demo
          serviceAccountRef:
            name: eso-demo
            audiences: ["openbao"]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-secret
  namespace: demo
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: hello-secret
  data:
    - secretKey: message
      remoteRef:
        key: demo/hello
        property: message
